['L01','ルール','アウトの数','3アウトになると、どうなりますか？',['攻撃と守備が交代する','点が1点入る','走者が全員進む'],0,'1チームの攻撃は3アウトで終了し、攻撃と守備が交代します。'],
['L02','ルール','フォースアウト','打者が1塁へ走るとき、1塁にいた走者はどうしますか？',['1塁にとどまる','2塁へ進む','ホームへ戻る'],1,'打者が1塁へ進むため、1塁走者は2塁へ進まなければなりません。'],
['L03','ルール','フォースアウト','0アウト、走者1塁。内野ゴロで守備が2塁ベースを踏み、走者より先にボールを持っていました。どうなりますか？',['1塁走者がアウト','打者がアウト','どちらもセーフ'],0,'1塁走者には2塁へ進む義務があるので、ボールを持った守備側が先に2塁を踏めばフォースアウトです。'],
['L04','ルール','フライと帰塁','打ったフライを守備がノーバウンドで捕りました。打者はどうなりますか？',['セーフ','アウト','もう一度打つ'],1,'フェア・ファウルに関係なく、打球をノーバウンドで正しく捕球すれば打者はアウトです。'],
['L05','守備','守備位置','三塁ベースの近くを主に守る選手は？',['ファースト','サード','センター'],1,'サード（三塁手）は三塁付近を守る内野手です。'],
['L06','守備','送球先の判断','0アウト、走者なし。サードがゴロを捕りました。まずアウトを狙う塁は？',['1塁','2塁','3塁'],0,'走者がいないときは、打者走者を1塁でアウトにするのが基本です。'],
['L07','守備','送球先の判断','0アウト、走者1塁。サードがゴロを捕りました。2塁で確実にアウトにでき、先頭走者をアウトにする方針です。まずどこへ投げますか？',['ホーム','2塁','3塁'],1,'2塁へ進まなければならない1塁走者を、2塁でフォースアウトにできます。'],

['L09','走塁','塁の順番','打者がヒットを打って走るとき、最初に向かう塁は？',['1塁','2塁','3塁'],0,'打者走者は1塁、2塁、3塁、ホームの順に進みます。'],
['L10','走塁','フライと帰塁','走者1塁。打球がフライで上がりました。まだ捕られるか分かりません。まず何に注意しますか？',['必ず2塁まで全力で走る','捕球されたときに1塁へ戻れるようにする','すぐベンチへ戻る'],1,'フライが捕られた場合は、進塁する前に元の塁へのリタッチが必要です。'],
['L11','走塁','タッチアップ','走者3塁。外野フライが捕られました。捕球後に3塁を離れ、ホームへ向かうプレーは？',['盗塁','タッチアップ','振り逃げ'],1,'フライ捕球後、元の塁に正しく触れた状態から進塁することをタッチアップと呼びます。'],
['L12','走塁','走り抜け','打者走者が1塁へ駆け抜けます。1塁を越えたあと、2塁へ進もうとする動きをせずに戻る場合は？',['越えた時点で必ずアウト','通常は駆け抜けが認められる','3塁へ行かなければならない'],1,'打者走者は1塁を駆け抜けられます。ただし2塁へ進もうとする動きをすると、タッチアウトの対象になります。'],
['L13','攻撃','打順','自分の打順が来る前に、まず何を確認しますか？',['次に打つ順番か','相手のベンチの人数','グラウンドの広さ'],0,'打順を確認し、打席に入る準備をします。'],
['L14','攻撃','ストライクとボール','投球がストライクゾーンを通り、打者が振りませんでした。判定は？',['ボール','ストライク','ファウル'],1,'ストライクゾーンを通った投球は、振らなくても原則ストライクです。'],
['L15','攻撃','四球','ボールが4つになりました。打者はどうなりますか？',['1塁へ進める','アウトになる','3塁へ進める'],0,'四球（フォアボール）では打者に1塁が与えられます。'],
['L16','攻撃','カウント','2ストライクで、次の投球を空振りしました。通常、打者はどうなりますか？',['三振になる','四球になる','1塁へ自動的に進める'],0,'通常は3つ目のストライクで三振です。振り逃げが成立する場合などは別の扱いになります。'],
['L17','予測','アウト数の確認','守備につく前、毎回確認しておきたい情報は？',['アウト数と走者の位置','観客の人数','相手の帽子の色'],0,'アウト数と走者の位置によって、次に狙うアウトや守備の動きが変わります。'],
['L18','予測','打球前の準備','走者1塁、1アウト。自分はショートです。打球が来る前に考えることは？',['ゴロが来たときの送球先','試合後のおやつ','次の打順だけ'],0,'プレー前に送球先を考えると、打球が来てから迷いにくくなります。'],

['T05','走塁','フライと帰塁','走者2塁。レフトへのフライが捕られました。捕球より前に2塁を離れていた走者が、進塁する前に必要なことは？',['2塁に戻って正しく触れる','そのまま3塁へ進む','1塁に戻る'],0,'フライが捕られたとき、進塁には元の塁へのリタッチが必要です。'],

['T08','攻撃','カウント','1ボール、2ストライク。次の投球を空振りしました。通常の判定は？',['四球','三振','ファウル'],1,'3つ目のストライクで三振です。振り逃げの条件が成立する場合は別です。'],
['T09','予測','アウト数の確認','2アウト、走者2塁。あなたはセカンドです。打球前に特に考えるべきことは？',['ゴロを捕ったときのアウトの取り方','観客席の場所','自分の次の打順だけ'],0,'2アウトでは次のアウトで攻守交代です。走者と打球に応じて、どこで確実にアウトを取るか準備します。'],

const KEY='yakyunou_v1';let data;try{data=JSON.parse(localStorage.getItem(KEY))||{}}catch{data={}};data.history ||= [];data.completed ||= [];data.test ||= [];data.seen ||= [];let session=null;const $=document.getElementById('app');const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function save(){localStorage.setItem(KEY,JSON.stringify(data))}function btn(label,action,kind='primary'){return `<button class="${kind}" onclick="${action}">${label}</button>`}function pct(a,b){return b?Math.round(a/b*100):0}function recent(cat){return data.history.filter(x=>x.cat===cat)}function stats(){const h=data.history;return {total:h.length,correct:h.filter(x=>x.ok).length,days:new Set(h.map(x=>x.day)).size}}function today(){return new Date().toLocaleDateString('sv-SE')}
function home(){session=null;let s=stats(),hasTest=data.test.some(x=>x.phase==='baseline'),post=data.test.some(x=>x.phase==='post'),ready=data.completed.length>=10;let bars=CATS.map(c=>{let a=recent(c);return `<div class="catrow"><span>${c}</span><div class="bar"><i style="width:${pct(a.filter(x=>x.ok).length,a.length)}%"></i></div><strong>${a.length?pct(a.filter(x=>x.ok).length,a.length)+'%':'—'}</strong></div>`}).join('');let stage=!hasTest?'学習前テスト':!post?'学習後テスト':'結果を見る';let testAction=!hasTest?'startTest("baseline")':!post?'startTest("post")':'results()';let testLocked=hasTest&&!post&&!ready;$.innerHTML=`<section class="game-hero" aria-label="ゲームスタート"><div class="hero-top"><span class="hero-label">★ BASEBALL QUEST ★</span><span class="hero-level">⚡ ルーキーリーグ</span></div><h2 class="hero-title">やきゅう脳<br>ドリル！</h2><p class="hero-sub">考える力で、試合のヒーローになろう！</p><div class="hero-scene"><svg class="hero-field" viewBox="0 0 260 165" role="img" aria-label="野球場のイラスト"><ellipse cx="130" cy="95" rx="120" ry="64" fill="#2a8d70" stroke="#65cba4" stroke-width="3"/><path d="M130 153 L38 88 L130 24 L222 88 Z" fill="#e2b576" stroke="#fff4d6" stroke-width="3"/><path d="M130 130 L73 89 L130 48 L187 89 Z" fill="#5fb47e"/><path d="M130 148 L130 22" stroke="#ffffff65" stroke-dasharray="4 5"/><g fill="#fff" stroke="#dce8e7" stroke-width="2"><rect x="124" y="139" width="12" height="12" transform="rotate(45 130 145)"/><rect x="216" y="82" width="12" height="12" transform="rotate(45 222 88)"/><rect x="124" y="18" width="12" height="12" transform="rotate(45 130 24)"/><rect x="32" y="82" width="12" height="12" transform="rotate(45 38 88)"/></g><circle cx="130" cy="91" r="8" fill="#dca46c" stroke="#fff4d6" stroke-width="2"/><g transform="translate(119 103)"><circle cx="11" cy="0" r="10" fill="#ffcf9c"/><path d="M1 -2 Q11 -19 21 -2" fill="#f5b634"/><path d="M4 11 Q11 6 18 11 L24 27 L-2 27Z" fill="#fefefe"/><path d="M9 10 L9 25 M14 10 L14 25" stroke="#1c7891" stroke-width="3"/></g></svg><span class="hero-ball">⚾</span><span class="hero-spark a">✦</span><span class="hero-spark b">✧</span></div><button class="hero-start" onclick="startDrill()">▶ ぼうけんスタート！</button><p class="hero-foot">1日10問 · 5つの分野にチャレンジ</p></section><div class="game-stats"><div class="game-stat"><strong>🔥 ${s.days}</strong><span>学習した日</span></div><div class="game-stat"><strong>⭐ ${s.total}</strong><span>クリアした問題</span></div><div class="game-stat"><strong>🎯 ${s.total?pct(s.correct,s.total)+'%':'—'}</strong><span>正答率</span></div></div><div class="mode-heading">🗺️ チャレンジメニュー</div><div class="mode-grid"><button class="mode-card test ${testLocked?'locked':''}" onclick="${testAction}" ${testLocked?'disabled':''}><span class="mode-icon">🧠</span><strong>${stage}</strong><small>${!hasTest?'最初に力だめし！ 初見の5問に挑戦':!post?(ready?'学んだ力を新しい問題でためそう':'ドリル10問クリアで解放！'):'学習前と学習後の結果をくらべよう'}</small></button><button class="mode-card review" onclick="startReview()"><span class="mode-icon">🔁</span><strong>リベンジ道場</strong><small>まちがえた問題にもう一度挑戦！</small></button><button class="mode-card record" onclick="results()"><span class="mode-icon">🏆</span><strong>せいちょう記録</strong><small>どれだけ強くなったか見てみよう</small></button><button class="mode-card" onclick="startDrill()"><span class="mode-icon">⚾</span><strong>毎日のドリル</strong><small>ルール・守備・走塁・攻撃・予測</small></button></div><section class="game-section"><h2>📊 5つの力を育てよう</h2>${bars}<p class="muted tiny">学習した問題の正答率を表示しています。</p></section><details class="panel"><summary>⚙️ データ管理・保護者向け情報</summary><p class="muted">記録はこの端末のブラウザ内に保存されます。SafariのWebサイトデータを削除すると消える場合があります。端末間の同期はありません。</p><p class="muted">転移テストは通常ドリルと別の初見問題を使います。各5問のため結果は参考値です。</p>${btn('記録をJSONで書き出す','exportData()','secondary')}<div style="height:10px"></div>${btn('全記録を消去','resetData()','ghost')}</details>`}

function startDrill(){let chosen=[];for(const c of CATS){let pool=L.filter(q=>q[1]===c);pool.sort((a,b)=>{let ha=data.history.filter(x=>x.id===a[0]),hb=data.history.filter(x=>x.id===b[0]);let wa=ha.length&&ha.at(-1).ok?1:0,wb=hb.length&&hb.at(-1).ok?1:0;return wa-wb||ha.length-hb.length});chosen.push(...pool.slice(0,2))}chosen.sort(()=>Math.random()-.5);begin('drill',chosen)}
function startReview(){let wrong=[...data.history].reverse().filter(x=>!x.ok).map(x=>x.id);let ids=[...new Set(wrong)].slice(0,10),qs=ids.map(id=>L.find(q=>q[0]===id)).filter(Boolean);if(!qs.length){alert('まだ復習する問題はありません。');return}begin('review',qs)}
function startTest(phase){if(phase==='baseline'&&data.test.some(x=>x.phase==='baseline'))return;if(phase==='post'&&(data.completed.length<10||data.test.some(x=>x.phase==='post')))return;let ids=phase==='baseline'?['T01','T03','T05','T07','T09']:['T02','T04','T06','T08','T10'];begin(phase,ids.map(id=>T.find(q=>q[0]===id)))}
function begin(mode,qs){session={mode,qs,i:0,answers:[],selected:null,locked:false,started:Date.now()};renderQuestion()}
function diamond(){return `<svg class="diagram" viewBox="0 0 300 185" role="img" aria-label="野球場の図。ホーム、1塁、2塁、3塁の位置"><path d="M150 163 L39 83 L150 12 L261 83 Z" fill="#c8e7c9" stroke="#78ae84" stroke-width="2"/><path d="M150 163 L95 83 L150 28 L205 83 Z" fill="#e8c69c" opacity=".75"/><g fill="white" stroke="#4d7865" stroke-width="2"><rect x="143" y="150" width="14" height="14" transform="rotate(45 150 157)"/><rect x="199" y="76" width="14" height="14" transform="rotate(45 206 83)"/><rect x="143" y="20" width="14" height="14" transform="rotate(45 150 27)"/><rect x="87" y="76" width="14" height="14" transform="rotate(45 94 83)"/></g><g font-size="13" fill="#2d5849" text-anchor="middle" font-weight="bold"><text x="150" y="181">ホーム</text><text x="237" y="86">1塁</text><text x="150" y="11">2塁</text><text x="62" y="86">3塁</text></g></svg>`}
function renderQuestion(){let s=session;if(!s)return home();let q=s.qs[s.i];s.selected=null;s.locked=false;s.started=Date.now();let test=['baseline','post'].includes(s.mode);$.innerHTML=`<div class="row"><span class="eyebrow">${test?'🧠 転移テスト':s.mode==='review'?'🔁 復習':'⚾ きょうのドリル'}</span><span class="muted">${s.i+1} / ${s.qs.length} 問</span></div><div class="progress"><span style="width:${s.i/s.qs.length*100}%"></span></div><div class="panel"><div class="row"><span class="tag">${esc(q[1])}</span><span class="muted tiny">${test?'初見テスト':'判断の練習'}</span></div><h2 style="margin-top:17px;line-height:1.65">${esc(q[3])}</h2>${['守備','走塁','予測'].includes(q[1])?diamond():''}<div class="stack answers" id="choices">${q[4].map((v,i)=>`<button class="choice" id="c${i}" onclick="pick(${i})">${'ABC'[i]}. ${esc(v)}</button>`).join('')}</div><div id="feedback"></div><div id="next"></div></div><p class="muted tiny">${test?'テスト中は正解・解説を表示しません。終了後にまとめて確認できます。':'答えを選ぶと、理由を確認できます。'}</p>${btn('中断してホームへ','home()','ghost')}`}
function pick(i){let s=session;if(!s||s.locked)return;s.locked=true;s.selected=i;let q=s.qs[s.i],ok=i===q[5],ms=Date.now()-s.started,test=['baseline','post'].includes(s.mode);s.answers.push({id:q[0],cat:q[1],principle:q[2],choice:i,ok,ms,day:today()});document.querySelectorAll('.choice').forEach((b,j)=>{b.disabled=true;if(j===i)b.classList.add('selected');if(!test&&j===q[5])b.classList.add('correct');if(!test&&j===i&&!ok)b.classList.add('wrong')});if(!test){data.history.push(s.answers.at(-1));data.completed.push(q[0]);save();document.getElementById('feedback').innerHTML=`<div class="notice ${ok?'':'warning'}"><b>${ok?'⭕ 正解！':'もう一度おぼえよう'}</b><p style="margin:5px 0">正解：${'ABC'[q[5]]}. ${esc(q[4][q[5]])}</p>${esc(q[6])}</div>`}else document.getElementById('feedback').innerHTML='<div class="notice">回答を記録しました。正解はテスト終了後に確認できます。</div>';document.getElementById('next').innerHTML=`<div style="height:12px"></div>${btn(s.i===s.qs.length-1?'結果を見る':'次の問題へ','nextQuestion()')}`}
function nextQuestion(){if(!session||!session.locked)return;session.i++;if(session.i<session.qs.length)renderQuestion();else finish()}
function finish(){let s=session,correct=s.answers.filter(a=>a.ok).length,test=['baseline','post'].includes(s.mode);if(test){data.test.push({phase:s.mode,day:today(),answers:s.answers});save()}let detail=s.answers.map((a,i)=>{let q=s.qs[i];return `<details><summary>${a.ok?'⭕':'✕'} ${esc(q[1])}：${esc(q[2])}</summary><p class="tiny">${esc(q[3])}</p><p class="tiny">あなたの答え：${esc(q[4][a.choice])}<br>正解：${esc(q[4][q[5]])}</p><p class="muted">${esc(q[6])}</p></details>`}).join('');session=null;$.innerHTML=`<div class="panel"><span class="eyebrow">${test?'転移テスト':'ドリル'} 結果</span><h2>おつかれさま！</h2><div class="big">${correct} / ${s.answers.length} 問正解</div><div class="progress"><span style="width:${pct(correct,s.answers.length)}%"></span></div><p class="muted">正答率 ${pct(correct,s.answers.length)}% · 平均回答時間 ${(s.answers.reduce((a,x)=>a+x.ms,0)/s.answers.length/1000).toFixed(1)}秒</p>${test?'<div class="notice">テスト問題はドリルに出しません。初見問題の結果として記録します。</div>':''}<h3>問題ごとの解説</h3>${detail}</div><div class="stack">${btn('学習レポートを見る','results()')}${btn('ホームに戻る','home()','secondary')}</div>`}
function results(){let s=stats(),base=data.test.find(x=>x.phase==='baseline'),post=data.test.find(x=>x.phase==='post');function score(t){return t?`${pct(t.answers.filter(a=>a.ok).length,t.answers.length)}%`:'未実施'}function avg(t){return t?(t.answers.reduce((n,a)=>n+a.ms,0)/t.answers.length/1000).toFixed(1)+'秒':'—'}$.innerHTML=`<div class="panel"><h2>📈 学習レポート</h2><div class="stats"><div class="stat"><b>${s.total}</b><small>ドリル回答数</small></div><div class="stat"><b>${s.total?pct(s.correct,s.total)+'%':'—'}</b><small>正答率</small></div><div class="stat"><b>${s.days}</b><small>学習日数</small></div></div></div><div class="panel"><h2>🧠 転移テスト比較</h2><div class="stats" style="grid-template-columns:1fr 1fr"><div class="stat"><small>学習前（5問）</small><b>${score(base)}</b><small>平均 ${avg(base)}</small></div><div class="stat"><small>学習後（5問）</small><b>${score(post)}</b><small>平均 ${avg(post)}</small></div></div><p class="muted">学習前と学習後は別の初見問題を使います。問題の難易度が完全に同じとは限らず、各5問なので結果は参考値です。</p>${base&&post?`<div class="notice">学習前後の正答率の差：${pct(post.answers.filter(x=>x.ok).length,5)-pct(base.answers.filter(x=>x.ok).length,5)}ポイント。これだけで実戦への転移や因果的な学習効果を証明することはできません。</div>`:''}</div><div class="panel"><h2>分野別の記録</h2>${CATS.map(c=>{let h=recent(c);return `<div class="catrow"><span>${c}</span><div class="bar"><i style="width:${pct(h.filter(x=>x.ok).length,h.length)}%"></i></div><strong>${h.length?pct(h.filter(x=>x.ok).length,h.length)+'%':'—'}</strong></div>`}).join('')}</div>${btn('ホームに戻る','home()','secondary')}`}
function exportData(){let blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='yakyunou-record-'+today()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}function resetData(){if(confirm('すべての学習記録を消去します。元に戻せません。よろしいですか？')){localStorage.removeItem(KEY);data={history:[],completed:[],test:[],seen:[]};home()}}home();
</script></body></html>
