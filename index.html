['L01','ルール','アウトの数','3アウトになると、どうなりますか？',['攻撃と守備が交代する','点が1点入る','走者が全員進む'],0,'1チームの攻撃は3アウトで終了し、攻撃と守備が交代します。'],
['L02','ルール','フォースアウト','打者が1塁へ走るとき、1塁にいた走者はどうしますか？',['1塁にとどまる','2塁へ進む','ホームへ戻る'],1,'打者が1塁へ進むため、1塁走者は2塁へ進まなければなりません。'],
['L03','ルール','フォースアウト','0アウト、走者1塁。内野ゴロで守備が2塁ベースを踏み、走者より先にボールを持っていました。どうなりますか？',['1塁走者がアウト','打者がアウト','どちらもセーフ'],0,'1塁走者には2塁へ進む義務があるので、ボールを持った守備側が先に2塁を踏めばフォースアウトです。'],
['L04','ルール','フライと帰塁','打ったフライを守備がノーバウンドで捕りました。打者はどうなりますか？',['セーフ','アウト','もう一度打つ'],1,'フェア・ファウルに関係なく、打球をノーバウンドで正しく捕球すれば打者はアウトです。'],
['L05','守備','守備位置','三塁ベースの近くを主に守る選手は？',['ファースト','サード','センター'],1,'サード（三塁手）は三塁付近を守る内野手です。'],
['L06','守備','送球先の判断','0アウト、走者なし。サードがゴロを捕りました。まずアウトを狙う塁は？',['1塁','2塁','3塁'],0,'走者がいないときは、打者走者を1塁でアウトにするのが基本です。'],
['L07','守備','送球先の判断','0アウト、走者1塁。サードがゴロを捕りました。2塁で確実にアウトにでき、先頭走者をアウトにする方針です。まずどこへ投げますか？',['ホーム','2塁','3塁'],1,'2塁へ進まなければならない1塁走者を、2塁でフォースアウトにできます。'],
['L08','守備','送球先の判断','0アウト、走者1塁。サードが弱いゴロを捕りました。2塁は間に合わず、1塁ならアウトにできます。どこへ投げますか？',['2塁','ホーム','1塁'],2,'アウトにできる塁を選びます。2塁に間に合わないなら、1塁で打者走者をアウトにする判断ができます。'],
['L09','走塁','塁の順番','打者がヒットを打って走るとき、最初に向かう塁は？',['1塁','2塁','3塁'],0,'打者走者は1塁、2塁、3塁、ホームの順に進みます。'],
['L10','走塁','フライと帰塁','走者1塁。打球がフライで上がりました。まだ捕られるか分かりません。まず何に注意しますか？',['必ず2塁まで全力で走る','捕球されたときに1塁へ戻れるようにする','すぐベンチへ戻る'],1,'フライが捕られた場合は、進塁する前に元の塁へのリタッチが必要です。'],
['L11','走塁','タッチアップ','走者3塁。外野フライが捕られました。捕球後に3塁を離れ、ホームへ向かうプレーは？',['盗塁','タッチアップ','振り逃げ'],1,'フライ捕球後、元の塁に正しく触れた状態から進塁することをタッチアップと呼びます。'],
['L12','走塁','走り抜け','打者走者が1塁へ駆け抜けます。1塁を越えたあと、2塁へ進もうとする動きをせずに戻る場合は？',['越えた時点で必ずアウト','通常は駆け抜けが認められる','3塁へ行かなければならない'],1,'打者走者は1塁を駆け抜けられます。ただし2塁へ進もうとする動きをすると、タッチアウトの対象になります。'],
['L13','攻撃','打順','自分の打順が来る前に、まず何を確認しますか？',['次に打つ順番か','相手のベンチの人数','グラウンドの広さ'],0,'打順を確認し、打席に入る準備をします。'],
['L14','攻撃','ストライクとボール','投球がストライクゾーンを通り、打者が振りませんでした。判定は？',['ボール','ストライク','ファウル'],1,'ストライクゾーンを通った投球は、振らなくても原則ストライクです。'],
['L15','攻撃','四球','ボールが4つになりました。打者はどうなりますか？',['1塁へ進める','アウトになる','3塁へ進める'],0,'四球（フォアボール）では打者に1塁が与えられます。'],
['L16','攻撃','カウント','2ストライクで、次の投球を空振りしました。通常、打者はどうなりますか？',['三振になる','四球になる','1塁へ自動的に進める'],0,'通常は3つ目のストライクで三振です。振り逃げが成立する場合などは別の扱いになります。'],
['L17','予測','アウト数の確認','守備につく前、毎回確認しておきたい情報は？',['アウト数と走者の位置','観客の人数','相手の帽子の色'],0,'アウト数と走者の位置によって、次に狙うアウトや守備の動きが変わります。'],
['L18','予測','打球前の準備','走者1塁、1アウト。自分はショートです。打球が来る前に考えることは？',['ゴロが来たときの送球先','試合後のおやつ','次の打順だけ'],0,'プレー前に送球先を考えると、打球が来てから迷いにくくなります。'],
['L19','予測','打球の種類','外野へ高いフライが上がりました。まず予測したいことは？',['捕れる打球か、落ちる打球か','次の試合の日付','相手の打順の名前'],0,'捕球できるかどうかで、走者への対応や次のプレーが変わります。'],

pick=function(i){if(session?.mode!=='unit-transfer')return originalPick(i);let x=session;if(x.locked)return;x.locked=true;let q=x.qs[x.i],ms=Date.now()-x.started,ok=i===q[5];x.answers.push({id:q[0],cat:q[1],principle:q[2],choice:i,ok,ms,day:today()});document.querySelectorAll('.choice').forEach((b,j)=>{b.disabled=true;if(j===i)b.classList.add('selected')});document.getElementById('feedback').innerHTML='<div class="notice">回答を記録しました。解説は終了後に表示します。</div>';document.getElementById('next').innerHTML='<div style="height:12px"></div>'+btn(x.i===x.qs.length-1?'結果を見る':'次の問題へ','nextQuestion()');}
const originalFinish=finish;
finish=function(){if(session?.mode==='unit-transfer'){data.unitTests ||= [];data.unitTests.push({day:today(),answers:session.answers});save();let s=session;let correct=s.answers.filter(a=>a.ok).length;let detail=s.answers.map((a,i)=>{let q=s.qs[i];return `<details><summary>${a.ok?'✓':'✕'} ${esc(q[1])}：${esc(q[2])}</summary><p>${esc(q[3])}</p><p>あなたの答え：${esc(q[4][a.choice])}</p><p>正解：${esc(q[4][q[5]])}</p><p class="muted">${esc(q[6])}</p></details>`}).join('');session=null;$.innerHTML=`<div class="panel"><div class="result-hero"><div class="result-kicker">TRANSFER TEST COMPLETE</div><div class="result-score">${pct(correct,s.answers.length)}%</div><div class="muted">${correct} / ${s.answers.length} 問正解</div></div><p class="notice">これは学習済み単元についての初見・理由確認テストです。実際の試合への転移を証明するものではありません。</p><h3>ふり返り</h3>${detail}</div><div class="stack">${btn('PLAYER DATAを見る','results()')}${btn('ホームに戻る','home()','secondary')}</div>`;return}originalFinish()}
const originalResults=results;
results=function(){originalResults();let tests=data.unitTests||[],n=tests.reduce((x,t)=>x+t.answers.length,0),correct=tests.reduce((x,t)=>x+t.answers.filter(a=>a.ok).length,0),used=new Set(tests.flatMap(t=>t.answers.map(a=>a.id))).size;let panel=document.createElement('section');panel.className='panel';panel.innerHTML=`<h2>🧠 単元別・初見テスト</h2><div class="stats"><div class="stat"><b>${n}</b><small>回答数</small></div><div class="stat"><b>${n?pct(correct,n)+'%':'—'}</b><small>正答率</small></div><div class="stat"><b>${used}/225</b><small>使用済み問題</small></div></div><p class="muted">理由問題・場面の言い換えを含むため、この結果のみで実戦への転移や自動化を判定することはできません。</p>${btn('単元別テストを受ける','startUnitTransfer()','secondary')}`;$.prepend(panel)}
const originalRenderQuestion=renderQuestion;
renderQuestion=function(){originalRenderQuestion();if(session?.mode==='unit-transfer'){let head=document.querySelector('.screen-title');if(head)head.textContent='TRANSFER TEST';let hint=document.querySelector('.question-panel .row .muted');if(hint)hint.textContent='初見・理由確認';let bottom=document.querySelector('main>p.muted');if(bottom)bottom.textContent='テスト中は正解を表示しません。終了後に解説します。'}}
home();
</script></body></html>
