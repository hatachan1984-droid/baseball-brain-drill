['L01','ルール','アウトの数','3アウトになると、どうなりますか？',['攻撃と守備が交代する','点が1点入る','走者が全員進む'],0,'1チームの攻撃は3アウトで終了し、攻撃と守備が交代します。'],
['L02','ルール','フォースアウト','打者が1塁へ走るとき、1塁にいた走者はどうしますか？',['1塁にとどまる','2塁へ進む','ホームへ戻る'],1,'打者が1塁へ進むため、1塁走者は2塁へ進まなければなりません。'],
['L03','ルール','フォースアウト','0アウト、走者1塁。内野ゴロで守備が2塁ベースを踏み、走者より先にボールを持っていました。どうなりますか？',['1塁走者がアウト','打者がアウト','どちらもセーフ'],0,'1塁走者には2塁へ進む義務があるので、ボールを持った守備側が先に2塁を踏めばフォースアウトです。'],
['L04','ルール','フライと帰塁','打ったフライを守備がノーバウンドで捕りました。打者はどうなりますか？',['セーフ','アウト','もう一度打つ'],1,'フェア・ファウルに関係なく、打球をノーバウンドで正しく捕球すれば打者はアウトです。'],
['L05','守備','守備位置','三塁ベースの近くを主に守る選手は？',['ファースト','サード','センター'],1,'サード（三塁手）は三塁付近を守る内野手です。'],
['L06','守備','送球先の判断','0アウト、走者なし。サードがゴロを捕りました。まずアウトを狙う塁は？',['1塁','2塁','3塁'],0,'走者がいないときは、打者走者を1塁でアウトにするのが基本です。'],
['L07','守備','送球先の判断','0アウト、走者1塁。サードがゴロを捕りました。2塁で確実にアウトにでき、先頭走者をアウトにする方針です。まずどこへ投げますか？',['ホーム','2塁','3塁'],1,'2塁へ進まなければならない1塁走者を、2塁でフォースアウトにできます。'],
['L08','守備','送球先の判断','0アウト、走者1塁。サードが弱いゴロを捕りました。2塁は間に合わず、1塁ならアウトにできます。どこへ投げますか？',['2塁','ホーム','1塁'],2,'アウトにできる塁を選びます。2塁に間に合わないなら、1塁で打者走者をアウトにする判断ができます。'],
['L09','走塁','塁の順番','打者がヒットを打って走るとき、最初に向かう塁は？',['1塁','2塁','3塁'],0,'打者走者は1塁、2塁、3塁、ホームの順に進みます。'],
['L10','走塁','フライと帰塁','走者1塁。打球がフライで上がりました。まだ捕られるか分かりません。まず何に注意しますか？',['必ず2塁まで全力で走る','捕球されたときに1塁へ戻れるようにする','すぐベンチへ戻る'],1,'フライが捕られた場合は、進塁する前に元の塁へのリタッチが必要です。'],
['L11','走塁','タッチアップ','走者3塁。外野フライが捕られました。捕球後に3塁を離れ、ホームへ向かうプレーは？',['盗塁','タッチアップ','振り逃げ'],1,'フライ捕球後、元の塁に正しく触れた状態から進塁することをタッチアップと呼びます。'],
['L12','走塁','走り抜け','打者走者が1塁へ駆け抜けます。1塁を越えたあと、2塁へ進もうとする動きをせずに戻る場合は？',['越えた時点で必ずアウト','通常は駆け抜けが認められる','3塁へ行かなければならない'],1,'打者走者は1塁を駆け抜けられます。ただし2塁へ進もうとする動きをすると、タッチアウトの対象になります。'],
['L13','攻撃','打順','自分の打順が来る前に、まず何を確認しますか？',['次に打つ順番か','相手のベンチの人数','グラウンドの広さ'],0,'打順を確認し、打席に入る準備をします。'],
['L14','攻撃','ストライクとボール','投球がストライクゾーンを通り、打者が振りませんでした。判定は？',['ボール','ストライク','ファウル'],1,'ストライクゾーンを通った投球は、振らなくても原則ストライクです。'],
['L15','攻撃','四球','ボールが4つになりました。打者はどうなりますか？',['1塁へ進める','アウトになる','3塁へ進める'],0,'四球（フォアボール）では打者に1塁が与えられます。'],
['L16','攻撃','カウント','2ストライクで、次の投球を空振りしました。通常、打者はどうなりますか？',['三振になる','四球になる','1塁へ自動的に進める'],0,'通常は3つ目のストライクで三振です。振り逃げが成立する場合などは別の扱いになります。'],
['L17','予測','アウト数の確認','守備につく前、毎回確認しておきたい情報は？',['アウト数と走者の位置','観客の人数','相手の帽子の色'],0,'アウト数と走者の位置によって、次に狙うアウトや守備の動きが変わります。'],
['L18','予測','打球前の準備','走者1塁、1アウト。自分はショートです。打球が来る前に考えることは？',['ゴロが来たときの送球先','試合後のおやつ','次の打順だけ'],0,'プレー前に送球先を考えると、打球が来てから迷いにくくなります。'],
['L19','予測','打球の種類','外野へ高いフライが上がりました。まず予測したいことは？',['捕れる打球か、落ちる打球か','次の試合の日付','相手の打順の名前'],0,'捕球できるかどうかで、走者への対応や次のプレーが変わります。'],
['L20','予測','状況の変化','2アウト、走者なし。内野ゴロを捕ったとき、まず狙うのは？',['1塁で打者走者をアウトにする','2塁で走者をアウトにする','3塁で走者をアウトにする'],0,'走者がいないので1塁で打者走者をアウトにするのが基本です。3アウト目なら攻守交代です。']
];

['T01','ルール','フォースアウト','1アウト、走者1・2塁。ショートがゴロを捕り、3塁にボールを送って走者より先にベースを踏みました。2塁走者は？',['アウト','セーフ','打者がアウト'],0,'2塁走者は3塁へ進む義務があるため、3塁でフォースアウトにできます。'],
['T02','ルール','フォースアウト','走者2塁のみ。サードがゴロを捕り、走者より先に3塁ベースを踏みました。走者は？',['必ずアウト','ベースを踏んだだけではアウトにならない','打者がアウト'],1,'走者2塁のみなら3塁へ進む義務はありません。3塁でアウトにするには原則タッチが必要です。'],
['T03','守備','送球先の判断','1アウト、走者1塁。ショートへの強いゴロ。2塁で確実にアウトにでき、先頭走者をアウトにする方針です。まずどこへ送球？',['2塁','ホーム','3塁'],0,'守備位置が変わっても、フォースアウトにできる塁を判断します。'],
['T04','守備','送球先の判断','1アウト、走者1塁。ショートがゆっくりしたゴロを捕りました。2塁は間に合わず、1塁は間に合います。どこへ投げる？',['2塁','1塁','ホーム'],1,'無理に2塁を狙わず、アウトにできる1塁へ投げます。'],
['T05','走塁','フライと帰塁','走者2塁。レフトへのフライが捕られました。捕球より前に2塁を離れていた走者が、進塁する前に必要なことは？',['2塁に戻って正しく触れる','そのまま3塁へ進む','1塁に戻る'],0,'フライが捕られたとき、進塁には元の塁へのリタッチが必要です。'],
['T06','走塁','タッチアップ','走者3塁。ライトへのフライが捕られました。3塁走者が捕球後に塁を離れてホームへ向かいました。このプレーは？',['タッチアップ','フォースアウト','四球'],0,'外野手や打球方向が変わっても、捕球後のリタッチからの進塁はタッチアップです。'],
['T07','攻撃','四球','3ボール、1ストライク。次の投球はストライクゾーンの外で、打者は振りませんでした。どうなる？',['四球で1塁へ進む','三振','そのまま打席を続ける'],0,'ボールが4つになったので四球です。'],
['T08','攻撃','カウント','1ボール、2ストライク。次の投球を空振りしました。通常の判定は？',['四球','三振','ファウル'],1,'3つ目のストライクで三振です。振り逃げの条件が成立する場合は別です。'],
['T09','予測','アウト数の確認','2アウト、走者2塁。あなたはセカンドです。打球前に特に考えるべきことは？',['ゴロを捕ったときのアウトの取り方','観客席の場所','自分の次の打順だけ'],0,'2アウトでは次のアウトで攻守交代です。走者と打球に応じて、どこで確実にアウトを取るか準備します。'],
['T10','予測','状況の変化','0アウト、走者なし。あなたはファーストです。サードがゴロを捕りました。次に起こりそうなプレーは？',['1塁への送球','3塁への送球','ホームへの送球'],0,'走者がいないゴロでは、打者走者を1塁でアウトにするプレーが基本です。']
];
const KEY='yakyunou_v1';let data;try{data=JSON.parse(localStorage.getItem(KEY))||{}}catch{data={}};data.history ||= [];data.completed ||= [];data.test ||= [];data.seen ||= [];let session=null;const $=document.getElementById('app');const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function save(){localStorage.setItem(KEY,JSON.stringify(data))}function btn(label,action,kind='primary'){return `<button class="${kind}" onclick="${action}">${label}</button>`}function pct(a,b){return b?Math.round(a/b*100):0}function recent(cat){return data.history.filter(x=>x.cat===cat)}function stats(){const h=data.history;return {total:h.length,correct:h.filter(x=>x.ok).length,days:new Set(h.map(x=>x.day)).size}}function today(){return new Date().toLocaleDateString('sv-SE')}
function home(){session=null;let s=stats(),hasTest=data.test.some(x=>x.phase==='baseline'),post=data.test.some(x=>x.phase==='post'),ready=data.completed.length>=10;let bars=CATS.map(c=>{let a=recent(c);return `<div class="catrow"><span>${c}</span><div class="bar"><i style="width:${pct(a.filter(x=>x.ok).length,a.length)}%"></i></div><strong>${a.length?pct(a.filter(x=>x.ok).length,a.length)+'%':'—'}</strong></div>`}).join('');let stage=!hasTest?'学習前テスト':!post?'学習後テスト':'テスト結果';let testAction=!hasTest?'startTest("baseline")':!post?'startTest("post")':'results()';let testLocked=hasTest&&!post&&!ready;$.innerHTML=`<section class="game-hero" aria-label="スタート画面"><div class="hero-top"><span class="hero-label">★ BASEBALL BRAIN DRILL</span><span class="hero-level">ROOKIE LEAGUE</span></div><h2 class="hero-title">やきゅう脳ドリル</h2><p class="hero-sub">考える力が、プレーを変える。</p><div class="hero-scene"><svg class="hero-field" viewBox="0 0 300 200" role="img" aria-label="ナイター球場のグラウンド"><defs><linearGradient id="grass" x2="0" y2="1"><stop stop-color="#1b684b"/><stop offset="1" stop-color="#145039"/></linearGradient></defs><ellipse cx="150" cy="120" rx="148" ry="75" fill="url(#grass)" stroke="#9ebc92" stroke-width="3"/><path d="M150 185 L38 112 L150 35 L262 112 Z" fill="#bf8956" stroke="#f3e1bc" stroke-width="3"/><path d="M150 161 L77 112 L150 62 L223 112 Z" fill="#287d51"/><path d="M150 185 L150 35 M38 112 L262 112" stroke="#ffffff45" stroke-width="1.5" stroke-dasharray="4 5"/><g fill="#fff8de" stroke="#ded0aa" stroke-width="2"><rect x="143" y="176" width="14" height="14" transform="rotate(45 150 183)"/><rect x="255" y="105" width="14" height="14" transform="rotate(45 262 112)"/><rect x="143" y="28" width="14" height="14" transform="rotate(45 150 35)"/><rect x="31" y="105" width="14" height="14" transform="rotate(45 38 112)"/></g><circle cx="150" cy="112" r="9" fill="#d9ae76" stroke="#eacaa2" stroke-width="2"/><g transform="translate(128 92)"><path d="M10 21 L28 21 L35 57 L4 57Z" fill="#fff9ec" stroke="#172d47" stroke-width="2"/><circle cx="19" cy="12" r="11" fill="#e1ad78"/><path d="M8 10 Q14 -9 30 7 L31 13 L8 13Z" fill="#0b243e"/><path d="M8 6 L-1 8" stroke="#0b243e" stroke-width="6"/><text x="19" y="43" text-anchor="middle" fill="#0c2d4b" font-size="16" font-weight="900">10</text></g></svg><span class="hero-ball">⚾</span><span class="hero-spark a">✦</span><span class="hero-spark b">✧</span></div><button class="hero-start" onclick="startDrill()">⚾　PLAY BALL　›</button><p class="hero-foot">TRAINING · 1日10問 · 5分野</p></section><div class="game-stats"><div class="game-stat"><strong>${s.days}</strong><span>学習日数</span></div><div class="game-stat"><strong>${s.total}</strong><span>解いた問題</span></div><div class="game-stat"><strong>${s.total?pct(s.correct,s.total)+'%':'—'}</strong><span>正答率</span></div></div><div class="mode-heading">GAME MENU</div><div class="mode-grid"><button class="mode-card" onclick="startDrill()"><span class="mode-icon">⚾</span><strong>TRAINING</strong><small>きょうのドリル・5分野の学習</small></button><button class="mode-card test ${testLocked?'locked':''}" onclick='${testAction}' ${testLocked?'disabled':''}><span class="mode-icon">🏆</span><strong>CHALLENGE</strong><small>${stage} · ${testLocked?'ドリル10問で解放':'初見問題で判断力をチェック'}</small></button><button class="mode-card record" onclick="results()"><span class="mode-icon">📊</span><strong>PLAYER DATA</strong><small>成長記録・転移テストの比較</small></button><button class="mode-card review" onclick="startReview()"><span class="mode-icon">🔁</span><strong>REVENGE</strong><small>まちがえた問題をもう一度</small></button></div><section class="game-section"><h2>5つの力 · SKILL DATA</h2>${bars}<p class="muted tiny">通常ドリルの正答率を表示しています。</p></section><details class="panel"><summary>⚙ データ管理・保護者向け情報</summary><p class="muted">学習記録はこのブラウザに保存されます。ブラウザデータを消去すると記録が失われる場合があります。</p><p class="muted">転移テストは学習用とは別の初見問題を各5問使用します。結果は参考値です。</p>${btn('記録をJSONで書き出す','exportData()','secondary')}<div style="height:10px"></div>${btn('全記録を消去','resetData()','ghost')}</details>`}
function startDrill(){let chosen=[];for(const c of CATS){let pool=L.filter(q=>q[1]===c);pool.sort((a,b)=>{let ha=data.history.filter(x=>x.id===a[0]),hb=data.history.filter(x=>x.id===b[0]);let wa=ha.length&&ha.at(-1).ok?1:0,wb=hb.length&&hb.at(-1).ok?1:0;return wa-wb||ha.length-hb.length});chosen.push(...pool.slice(0,2))}chosen.sort(()=>Math.random()-.5);begin('drill',chosen)}
function startReview(){let wrong=[...data.history].reverse().filter(x=>!x.ok).map(x=>x.id);let ids=[...new Set(wrong)].slice(0,10),qs=ids.map(id=>L.find(q=>q[0]===id)).filter(Boolean);if(!qs.length){alert('まだ復習する問題はありません。');return}begin('review',qs)}
function startTest(phase){if(phase==='baseline'&&data.test.some(x=>x.phase==='baseline'))return;if(phase==='post'&&(data.completed.length<10||data.test.some(x=>x.phase==='post')))return;let ids=phase==='baseline'?['T01','T03','T05','T07','T09']:['T02','T04','T06','T08','T10'];begin(phase,ids.map(id=>T.find(q=>q[0]===id)))}
function begin(mode,qs){session={mode,qs,i:0,answers:[],selected:null,locked:false,started:Date.now()};renderQuestion()}
function diamond(){return `<svg class="diagram" viewBox="0 0 320 190" role="img" aria-label="野球場の図。走者の位置は問題文で確認してください"><defs><pattern id="stripes" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#1b714e"/><rect width="12" height="24" fill="#216e4d"/></pattern></defs><path d="M160 167 L22 91 L160 13 L298 91 Z" fill="url(#stripes)" stroke="#a9c49c" stroke-width="2"/><path d="M160 167 L84 91 L160 33 L236 91 Z" fill="#bb8d5b"/><path d="M160 146 L109 91 L160 52 L211 91 Z" fill="#287a51"/><g fill="#fff9e9" stroke="#2d4b49" stroke-width="2"><rect x="153" y="153" width="14" height="14" transform="rotate(45 160 160)"/><rect x="229" y="84" width="14" height="14" transform="rotate(45 236 91)"/><rect x="153" y="26" width="14" height="14" transform="rotate(45 160 33)"/><rect x="77" y="84" width="14" height="14" transform="rotate(45 84 91)"/></g><g font-size="14" fill="#fff9e8" stroke="#0b2430" stroke-width=".6" paint-order="stroke" text-anchor="middle" font-weight="bold"><text x="160" y="184">ホーム</text><text x="278" y="95">1塁</text><text x="160" y="16">2塁</text><text x="44" y="95">3塁</text></g></svg>`}
function renderQuestion(){let s=session;if(!s)return home();let q=s.qs[s.i];s.selected=null;s.locked=false;s.started=Date.now();let test=['baseline','post'].includes(s.mode);let title=test?'CHALLENGE':s.mode==='review'?'REVENGE':'TRAINING';$.innerHTML=`<div class="screen-head"><button class="ghost" style="padding:8px 12px" onclick="home()" aria-label="ホームへ戻る">‹</button><span class="screen-title">${title}</span><span class="screen-counter">${s.i+1} / ${s.qs.length} 問</span></div><div class="progress"><span style="width:${s.i/s.qs.length*100}%"></span></div><div class="panel question-panel"><div class="row"><span class="tag">${esc(q[1])}</span><span class="muted tiny">${test?'初見・転移テスト':'判断の練習'}</span></div><h2 class="question-text">${esc(q[3])}</h2>${['守備','走塁','予測'].includes(q[1])?diamond():''}<div class="stack answers" id="choices">${q[4].map((v,i)=>`<button class="choice" id="c${i}" onclick="pick(${i})"><span style="color:#f2cc76;font-weight:900;margin-right:8px">${'ABC'[i]}</span> ${esc(v)}</button>`).join('')}</div><div id="feedback"></div><div id="next"></div></div><p class="muted tiny" style="text-align:center">${test?'テスト中は正解を表示しません。終了後に解説します。':'答えを選ぶと、理由を確認できます。'}</p>`}
function pick(i){let s=session;if(!s||s.locked)return;s.locked=true;s.selected=i;let q=s.qs[s.i],ok=i===q[5],ms=Date.now()-s.started,test=['baseline','post'].includes(s.mode);s.answers.push({id:q[0],cat:q[1],principle:q[2],choice:i,ok,ms,day:today()});document.querySelectorAll('.choice').forEach((b,j)=>{b.disabled=true;if(j===i)b.classList.add('selected');if(!test&&j===q[5])b.classList.add('correct');if(!test&&j===i&&!ok)b.classList.add('wrong')});if(!test){data.history.push(s.answers.at(-1));data.completed.push(q[0]);save();document.getElementById('feedback').innerHTML=`<div class="notice feedback-pop ${ok?'':'warning'}"><b style="font-size:23px;color:#ffdb86">${ok?'★ NICE PLAY!':'NEXT CHANCE!'}</b><p style="margin:5px 0">正解：${'ABC'[q[5]]}. ${esc(q[4][q[5]])}</p>${esc(q[6])}</div>`}else document.getElementById('feedback').innerHTML='<div class="notice">回答を記録しました。正解はテスト終了後に確認できます。</div>';document.getElementById('next').innerHTML=`<div style="height:12px"></div>${btn(s.i===s.qs.length-1?'結果を見る':'次の問題へ','nextQuestion()')}`}
function nextQuestion(){if(!session||!session.locked)return;session.i++;if(session.i<session.qs.length)renderQuestion();else finish()}
function finish(){let s=session,correct=s.answers.filter(a=>a.ok).length,test=['baseline','post'].includes(s.mode);if(test){data.test.push({phase:s.mode,day:today(),answers:s.answers});save()}let detail=s.answers.map((a,i)=>{let q=s.qs[i];return `<details><summary>${a.ok?'✓':'✕'} ${esc(q[1])}：${esc(q[2])}</summary><p class="tiny">${esc(q[3])}</p><p class="tiny">あなたの答え：${esc(q[4][a.choice])}<br>正解：${esc(q[4][q[5]])}</p><p class="muted">${esc(q[6])}</p></details>`}).join('');session=null;let avg=(s.answers.reduce((a,x)=>a+x.ms,0)/s.answers.length/1000).toFixed(1);$.innerHTML=`<div class="panel"><div class="result-hero"><div class="result-kicker">${test?'CHALLENGE COMPLETE':'GAME SET!'}</div><div class="result-score">${pct(correct,s.answers.length)}%</div><div class="muted">${correct} / ${s.answers.length} 問正解</div></div><div class="result-stats"><div><strong>${avg}秒</strong><small>平均回答時間</small></div><div><strong>${correct}問</strong><small>正解数</small></div></div>${test?'<p class="notice">初見テストの記録を保存しました。学習前後の結果はPLAYER DATAで比較できます。</p>':''}<h3>プレーを振り返ろう</h3>${detail}</div><div class="stack">${btn('PLAYER DATAを見る','results()')}${btn('ホームに戻る','home()','secondary')}</div>`}
function results(){let s=stats(),base=data.test.find(x=>x.phase==='baseline'),post=data.test.find(x=>x.phase==='post');function score(t){return t?`${pct(t.answers.filter(a=>a.ok).length,t.answers.length)}%`:'未実施'}function avg(t){return t?(t.answers.reduce((n,a)=>n+a.ms,0)/t.answers.length/1000).toFixed(1)+'秒':'—'}$.innerHTML=`<div class="panel"><h2>📈 学習レポート</h2><div class="stats"><div class="stat"><b>${s.total}</b><small>ドリル回答数</small></div><div class="stat"><b>${s.total?pct(s.correct,s.total)+'%':'—'}</b><small>正答率</small></div><div class="stat"><b>${s.days}</b><small>学習日数</small></div></div></div><div class="panel"><h2>🧠 転移テスト比較</h2><div class="stats" style="grid-template-columns:1fr 1fr"><div class="stat"><small>学習前（5問）</small><b>${score(base)}</b><small>平均 ${avg(base)}</small></div><div class="stat"><small>学習後（5問）</small><b>${score(post)}</b><small>平均 ${avg(post)}</small></div></div><p class="muted">学習前と学習後は別の初見問題を使います。問題の難易度が完全に同じとは限らず、各5問なので結果は参考値です。</p>${base&&post?`<div class="notice">学習前後の正答率の差：${pct(post.answers.filter(x=>x.ok).length,5)-pct(base.answers.filter(x=>x.ok).length,5)}ポイント。これだけで実戦への転移や因果的な学習効果を証明することはできません。</div>`:''}</div><div class="panel"><h2>分野別の記録</h2>${CATS.map(c=>{let h=recent(c);return `<div class="catrow"><span>${c}</span><div class="bar"><i style="width:${pct(h.filter(x=>x.ok).length,h.length)}%"></i></div><strong>${h.length?pct(h.filter(x=>x.ok).length,h.length)+'%':'—'}</strong></div>`}).join('')}</div>${btn('ホームに戻る','home()','secondary')}`}
function exportData(){let blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='yakyunou-record-'+today()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}function resetData(){if(confirm('すべての学習記録を消去します。元に戻せません。よろしいですか？')){localStorage.removeItem(KEY);data={history:[],completed:[],test:[],seen:[]};home()}}home();
</script></body></html>
